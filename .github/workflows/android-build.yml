name: Android frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Repository currently uses Angular 19 with ng2-charts 10; follow the existing peer-dependency install mode.
      - run: npm ci --legacy-peer-deps
      - name: Validate route and feature parity
        run: npm run check:parity
      - name: Test report-card review integrity and Principal screens
        run: npm test -- --watch=false --browsers=ChromeHeadless --ts-config=tsconfig.report-card-review.spec.json --include='src/app/components/report-card-approvals/*.spec.ts' --include='src/app/components/report-card-v2/rc2.spec.ts' --include='src/app/app.routes.principal.spec.ts' --include='src/app/auth/principal-capability.guard.spec.ts' --include='src/app/services/leadership-people.spec.ts' --include='src/app/components/principal-dashboard/*.spec.ts' --include='src/app/components/principal-management/*.spec.ts' --include='src/app/components/signature-settings/*.spec.ts' --include='src/app/components/view-leaves/*.spec.ts' --include='src/app/components/notice/notice.component.principal.spec.ts' --include='src/app/components/fees/*.spec.ts' --include='src/app/components/payment/*.spec.ts' --include='src/app/components/super-admin-dashboard/*.spec.ts' --include='src/app/components/fee-generation-target/*.spec.ts' --include='src/app/components/super-admin-payment-gateways/*.spec.ts' --include='src/app/components/notification-delivery-log/*.spec.ts' --include='src/app/components/legal/*.spec.ts'
      - run: npm run build:android

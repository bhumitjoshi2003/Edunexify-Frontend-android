name: Android frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Repository currently uses Angular 19 with ng2-charts 10; follow the existing peer-dependency install mode.
      - run: npm ci --legacy-peer-deps
      - run: npm run build:android

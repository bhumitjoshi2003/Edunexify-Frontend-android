name: Android frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Repository currently uses Angular 19 with ng2-charts 10; follow the existing peer-dependency install mode.
      - run: npm ci --legacy-peer-deps
      - name: Validate route and feature parity
        run: npm run check:parity
      - name: Test report-card review integrity and Principal screens
        run: npm test -- --watch=false --browsers=ChromeHeadless --ts-config=tsconfig.report-card-review.spec.json --include='src/app/components/report-card-approvals/*.spec.ts' --include='src/app/components/report-card-v2/rc2.spec.ts' --include='src/app/app.routes.principal.spec.ts' --include='src/app/auth/principal-capability.guard.spec.ts' --include='src/app/services/leadership-people.spec.ts' --include='src/app/components/principal-dashboard/*.spec.ts' --include='src/app/components/principal-management/*.spec.ts' --include='src/app/components/signature-settings/*.spec.ts' --include='src/app/components/view-leaves/*.spec.ts' --include='src/app/components/leave-escalation-badge/*.spec.ts' --include='src/app/components/coordinator-*/*.spec.ts' --include='src/app/services/coordinator.service.spec.ts' --include='src/app/auth/role.guard.spec.ts' --include='src/app/components/dashboard/dashboard.component.update-banner.spec.ts' --include='src/app/components/staff-attendance/staff-attendance.principal.spec.ts' --include='src/app/services/teacher-checkin.principal.spec.ts' --include='src/app/utils/leave-escalation-priority.spec.ts' --include='src/app/components/apply-leave/*.priority-hint.spec.ts' --include='src/app/components/apply-teacher-leave/*.priority-hint.spec.ts' --include='src/app/components/notice/notice.component.principal.spec.ts' --include='src/app/components/fees/*.spec.ts' --include='src/app/components/payment/*.spec.ts' --include='src/app/components/super-admin-dashboard/*.spec.ts' --include='src/app/components/fee-generation-target/*.spec.ts' --include='src/app/components/super-admin-payment-gateways/*.spec.ts' --include='src/app/components/notification-delivery-log/*.spec.ts' --include='src/app/components/legal/*.spec.ts'
      - name: Test administrator setup-link workflow
        run: npm test -- --watch=false --browsers=ChromeHeadless --ts-config=tsconfig.report-card-review.spec.json --include='src/app/components/admin-details/*.spec.ts' --include='src/app/components/student-details/*.spec.ts'
      - name: Test fee configuration and reconciliation
        run: npm test -- --watch=false --browsers=ChromeHeadless --ts-config=tsconfig.report-card-review.spec.json --include='src/app/components/fee-structure/*.spec.ts' --include='src/app/components/fee-rule-config/*.spec.ts' --include='src/app/components/fee-assignment/*.spec.ts' --include='src/app/components/fee-recalculation/*.spec.ts' --include='src/app/components/fee-reminders/*.spec.ts' --include='src/app/components/fee-head-management/*.spec.ts'
      - name: Test registration, password reset and event editing
        run: npm test -- --watch=false --browsers=ChromeHeadless --ts-config=tsconfig.report-card-review.spec.json --include='src/app/components/register/*.spec.ts' --include='src/app/components/register-student/*.spec.ts' --include='src/app/components/register-teacher/*.spec.ts' --include='src/app/components/reset-password/*.spec.ts' --include='src/app/components/event-form/*.spec.ts'
      - run: npm run build:android
